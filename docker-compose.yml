services:
  routine:
    build: .
    hostname: ${SESSION_NAME:-routine}
    env_file:
      - path: .env
        required: false
    environment:
      SESSION_NAME: ${SESSION_NAME:-routine}
      CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX: ${SESSION_NAME:-routine}
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - .:/app
      - ../files/home:/root
    stdin_open: true
    tty: true
    restart: unless-stopped
networks:
  dokploy-network:
    external: true
