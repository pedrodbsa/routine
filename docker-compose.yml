# Dokploy Compose service. Publishes no ports — Remote Control is outbound HTTPS only.
services:
    routine:
        build: .
        # Docker assigns a fresh random hostname every time Dokploy recreates the container, and
        # Remote Control surfaces it in the app's machine list. Pinning it keeps each deploy from
        # appearing as a new machine.
        hostname: ${SESSION_NAME:-routine}
        env_file:
            - path: .env
              required: false
        environment:
            SESSION_NAME: ${SESSION_NAME:-routine}
            CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX: ${SESSION_NAME:-routine}
            TZ: ${TZ:-Europe/Lisbon}
        volumes:
            # Dokploy's clone of this repo — what the session reads and writes.
            - .:/app
            # ../files sits outside the directory Dokploy clears on deploy. Mounting the whole
            # home in one go keeps .claude/ (credentials), .claude.json (workspace trust) and
            # .garminconnect/ (Garmin token cache) together.
            - ../files/home:/root
        stdin_open: true
        tty: true
        restart: unless-stopped
