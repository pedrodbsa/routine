services:
  routine:
    build: .
    hostname: ${SESSION_NAME:-routine}
    env_file:
      - path: .env
        required: false
    environment:
      SESSION_NAME: ${SESSION_NAME:-routine}
      CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX: ${SESSION_NAME:-routine}
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - ../files/repo:/app
      - ../files/home:/root
    # tini as PID 1 reaps the orphans tmux and the Claude processes leave behind.
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  dokploy-network:
    external: true
